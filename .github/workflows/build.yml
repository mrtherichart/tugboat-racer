name: Build Tugboat Racer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libasound2-dev libxinerama-dev
      - name: Install Odin
        run: bash scripts/install-odin.sh
      - name: Compile Linux prototype
        run: |
          mkdir -p out
          odin check src
          odin build src -out:out/tugboat-racer-linux
      - uses: actions/upload-artifact@v4
        with:
          name: tugboat-linux
          path: out/tugboat-racer-linux
          if-no-files-found: error
  android:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.30.3"
      - name: Install Odin
        run: bash scripts/install-odin.sh
      - name: Build APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tugboat-android-debug
          path: raymob/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
