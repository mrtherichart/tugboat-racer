name: Android APK — Tugboat Racer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The Linux build is developed, compiled and tested inside ChatGPT's VM.
# GitHub receives a mirror of the versioned source ZIP and builds Android only.
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.30.3"
      - name: Install Odin
        run: bash scripts/install-odin.sh
      - name: Build Android debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash scripts/build-android.sh
      - name: Upload APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: tugboat-android-debug
          path: raymob/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
